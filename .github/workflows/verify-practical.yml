name: Verify museum and practical UI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: practical-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  then-now-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fixed browser harness outside application dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/then-now-playwright" --no-save playwright@1.56.1
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/99-museum-network-bounds
          "$RUNNER_TEMP/then-now-playwright/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Six interactive pairs, actual audio required, three widths
        env:
          BROWSERS: ${{ matrix.browser }}
          WIDTHS: 375,390,1280
          EVIDENCE_DIR: then-now-browser-evidence
          REQUIRE_CLEAN: 1
        run: |
          set -o pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/then-now-playwright/node_modules/playwright"
          node scripts/verify-then-now-browser.mjs 2>&1 | tee then-now-browser.log
      - name: Existing Flash interactions and inheritance comparison
        if: ${{ !cancelled() }}
        env:
          BROWSERS: ${{ matrix.browser }}
          WIDTHS: 375
          EVIDENCE_DIR: flash-legacy-evidence
          LEGACY: 1
          REQUIRE_CLEAN: 1
        run: |
          set -o pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/then-now-playwright/node_modules/playwright"
          node scripts/verify-then-now-browser.mjs 2>&1 | tee flash-legacy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: then-now-${{ matrix.browser }}-${{ github.event.pull_request.head.sha }}
          path: |
            then-now-browser-evidence/
            then-now-browser.log
            flash-legacy-evidence/
            flash-legacy.log
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Existing full contract (lint, types, build, all tests)
        run: |
          set -o pipefail
          git rev-parse HEAD
          npm run check 2>&1 | tee contract-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-${{ github.event.pull_request.head.sha }}
          path: contract-results.log
  practical-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fixed browser harness outside application dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/practical-playwright" --no-save playwright@1.56.1
          # The tested runner's Azure HTTP mirror stalled before any GUI test.
          # Keep signed Ubuntu repositories and TLS; bound network acquisition.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/99-museum-network-bounds
          "$RUNNER_TEMP/practical-playwright/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Actual interaction and rendering
        env:
          BROWSERS: ${{ matrix.browser }}
          WIDTHS: 390,375,1280
          EVIDENCE_DIR: practical-browser-evidence
        run: |
          set -o pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/practical-playwright/node_modules/playwright"
          node scripts/verify-practical-browser.mjs 2>&1 | tee practical-browser.log
      - name: Phase 4A actual states, intermediate geometry and rendering
        if: ${{ !cancelled() }}
        env:
          BROWSERS: ${{ matrix.browser }}
          WIDTHS: 375,390,765,1280
          EVIDENCE_DIR: phase4a-browser-evidence
        run: |
          set -o pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/practical-playwright/node_modules/playwright"
          node scripts/verify-phase4a-browser.mjs 2>&1 | tee phase4a-browser.log
          SELECT_EVIDENCE_DIR=phase4a-select-evidence node scripts/verify-phase4a-select-browser.mjs 2>&1 | tee phase4a-select.log
      - name: Phase 4B operations and stale response protection
        if: ${{ !cancelled() }}
        env:
          BROWSERS: ${{ matrix.browser }}
          WIDTHS: 375,390,765,1280
          EVIDENCE_DIR: phase4b-browser-evidence
        run: |
          set -o pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/practical-playwright/node_modules/playwright"
          node scripts/verify-phase4b-browser.mjs 2>&1 | tee phase4b-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practical-${{ matrix.browser }}-${{ github.event.pull_request.head.sha }}
          path: |
            practical-browser-evidence/
            practical-browser.log
            phase4a-browser-evidence/
            phase4a-browser.log
            phase4a-select-evidence/
            phase4a-select.log
            phase4b-browser-evidence/
            phase4b-browser.log
  phase5a-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fixed browser harness outside application dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/practical-playwright" --no-save playwright@1.56.1
          # The tested runner's Azure HTTP mirror stalled before any GUI test.
          # Keep signed Ubuntu repositories and TLS; bound network acquisition.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/99-museum-network-bounds
          "$RUNNER_TEMP/practical-playwright/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Phase 5A data selection and exploration
        if: ${{ !cancelled() }}
        env:
          BROWSERS: ${{ matrix.browser }}
          WIDTHS: 320,375,390,1280
          EVIDENCE_DIR: phase5a-browser-evidence
        run: |
          set -o pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/practical-playwright/node_modules/playwright"
          node scripts/verify-phase5a-browser.mjs 2>&1 | tee phase5a-browser.log
      - name: Phase 5A focused deletion, date and chips regressions
        env:
          BROWSERS: ${{ matrix.browser }}
          EVIDENCE_DIR: phase5a-focus-evidence
        run: |
          set -o pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/practical-playwright/node_modules/playwright"
          node scripts/verify-phase5a-focus.mjs 2>&1 | tee phase5a-focus.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5a-${{ matrix.browser }}-${{ github.event.pull_request.head.sha }}
          path: |
            phase5a-browser-evidence/
            phase5a-browser.log
            phase5a-focus-evidence/
            phase5a-focus.log
