name: Phase 7D Safety Infrastructure Only
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/phase7d-interactive-motion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dedicated evidence and temp
        shell: bash
        run: mkdir -p work/safety/temp work/safety/evidence
      - name: Standard checks, exact test set and dummy-only contracts
        shell: bash
        run: |
          export SAFETY_TEMP="$GITHUB_WORKSPACE/work/safety/temp"
          export TMPDIR="$GITHUB_WORKSPACE/work/safety/temp" TMP="$GITHUB_WORKSPACE/work/safety/temp" TEMP="$GITHUB_WORKSPACE/work/safety/temp"
          node scripts/phase7d-execution-source.mjs capture "$PWD" "$(git rev-parse HEAD)" work/safety/execution-source safety-contracts > work/safety/evidence/source-capture.json
          node scripts/phase7d-safety-test-set.mjs > work/safety/evidence/test-set.json
          npm run check > work/safety/evidence/check.log 2>&1
          node --test tests/phase7d-safety-dummy.test.mjs tests/phase7d-safety-provenance.test.mjs tests/phase7d-safety-cleanup.test.mjs tests/phase7d-execution-source.test.mjs tests/phase7d-isolated-browser.test.mjs tests/phase7d-isolated-errors.test.mjs tests/phase7d-isolated-trace.test.mjs > work/safety/evidence/safety.tap
      - name: Independent saved source bodies and checkout audit
        if: always()
        shell: bash
        run: node scripts/phase7d-execution-source.mjs audit "$PWD" "$(git rev-parse HEAD)" work/safety/execution-source safety-contracts > work/safety/evidence/source-readback.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-contracts-${{ matrix.os }}-${{ github.event_name }}
          path: |
            work/safety/evidence/
            work/safety/execution-source/
          include-hidden-files: true
          retention-days: 30
  fixture:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dedicated tooling and temp
        run: |
          mkdir -p work/safety/temp
          npm install --prefix work/safety/tools --no-save playwright@1.56.1
          work/safety/tools/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Fixed eight minimal-model trials, not production or product acceptance
        env:
          SAFETY_MODE: fixture-validation
        run: |
          export SAFETY_TEMP="$GITHUB_WORKSPACE/work/safety/temp"
          export TMPDIR="$GITHUB_WORKSPACE/work/safety/temp" TMP="$GITHUB_WORKSPACE/work/safety/temp" TEMP="$GITHUB_WORKSPACE/work/safety/temp"
          export PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/work/safety/tools/node_modules/playwright"
          node scripts/phase7d-safety-browser.mjs work/safety/browser
      - name: Separate-process Git and captured bytes audit
        if: always()
        run: |
          node scripts/audit-phase7d-safety-results.mjs work/safety/browser
          for trial in work/safety/browser/fixture-*; do
            node scripts/phase7d-safety-provenance.mjs "$PWD" "$(git rev-parse HEAD)" work/safety/browser/build work/safety/browser/build-manifest.json "$trial/http" "$trial/served.json" > "$trial/independent-bytes-audit.json" || exit 1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-minimal-model-browser-${{ github.event_name }}
          path: work/safety/browser/
          retention-days: 30
