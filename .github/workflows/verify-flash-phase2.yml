name: Flash Then & Now phase 2
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: flash-phase2-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pinned browser harness outside application dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/flash-phase2-playwright" --no-save playwright@1.56.1
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          "$RUNNER_TEMP/flash-phase2-playwright/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Six paired works at four widths, real input and lifecycle
        env:
          BROWSERS: ${{ matrix.browser }}
          WIDTHS: 375,390,765,1280
          EVIDENCE_DIR: flash-phase2-evidence
          REQUIRE_CLEAN: 1
        run: |
          set -o pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/flash-phase2-playwright/node_modules/playwright"
          node scripts/verify-flash-phase2-browser.mjs 2>&1 | tee flash-phase2-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flash-phase2-${{ matrix.browser }}-${{ github.event.pull_request.head.sha }}
          path: |
            flash-phase2-evidence/
            flash-phase2-browser.log
