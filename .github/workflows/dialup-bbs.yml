name: Verify Dial-up BBS registration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bbs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            playwright: "1.56.1"
          # WebKit r2215 crashes when crossing documents after same-document history traversal.
          - browser: webkit
            playwright: "1.57.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --maxWorkers=2 tests/dialup-bbs-registration.test.ts
      - name: Unit and compatibility contracts with original stdout
        run: |
          mkdir -p work/dialup-bbs
          set -o pipefail
          node --test tests/dialup-bbs-focus.test.mjs tests/dialup-bbs-ansi.test.mjs tests/dialup-bbs-communications.test.mjs docs/dialup-bbs/prototype/terminal.test.mjs | tee work/dialup-bbs/unit-tests.log
      - run: node scripts/verify-dialup-bbs-ansi-negative.mjs
      - run: node scripts/verify-dialup-bbs-communications-negative.mjs
      - run: AUDIT_OUTPUT=work/dialup-bbs/inventory.json node scripts/audit-dialup-bbs.mjs
      - run: node scripts/build-layer-composer.mjs
      - name: Browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/bbs-tools" --no-save "playwright@${{ matrix.playwright }}"
          "$RUNNER_TEMP/bbs-tools/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Real HTTP and keyboard tests
        env:
          BBS_BROWSER: ${{ matrix.browser }}
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/bbs-tools/node_modules/playwright"
          node scripts/verify-dialup-bbs-browser.mjs
          node scripts/verify-dialup-bbs-ansi-browser.mjs
          node scripts/verify-dialup-bbs-communications-browser.mjs
      - name: Record case file digests
        if: always()
        run: |
          if [ -d work/dialup-bbs ]; then
            cd work/dialup-bbs
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dialup-bbs-${{ matrix.browser }}-${{ github.event.pull_request.head.sha }}
          path: work/dialup-bbs/
          if-no-files-found: warn
