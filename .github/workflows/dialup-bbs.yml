name: Verify Dial-up BBS registration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bbs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --maxWorkers=2 tests/dialup-bbs-registration.test.ts
      - run: node --test tests/dialup-bbs-focus.test.mjs docs/dialup-bbs/prototype/terminal.test.mjs
      - run: AUDIT_OUTPUT=work/dialup-bbs/inventory.json node scripts/audit-dialup-bbs.mjs
      - run: node scripts/build-layer-composer.mjs
      - name: Browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/bbs-tools" --no-save playwright@1.56.1
          "$RUNNER_TEMP/bbs-tools/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Real HTTP and keyboard tests
        env:
          BBS_BROWSER: ${{ matrix.browser }}
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/bbs-tools/node_modules/playwright"
          node scripts/verify-dialup-bbs-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dialup-bbs-${{ matrix.browser }}-${{ github.event.pull_request.head.sha }}
          path: work/dialup-bbs/
          if-no-files-found: warn
