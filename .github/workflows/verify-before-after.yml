name: Verify Before After Compare
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  state-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        width: [375, 390, 765, 1280]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npx vitest run --maxWorkers=2 tests/before-after-compare.test.tsx tests/pan-zoom.test.tsx tests/image-crop.test.tsx tests/phase5b-compare.test.tsx && npm run build
      - name: Fixed external browser and PNG tools
        run: |
          npm install --prefix "$RUNNER_TEMP/before-after-playwright" --no-save playwright@1.56.1 pngjs@7.0.0
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/99-museum-network-bounds
          "$RUNNER_TEMP/before-after-playwright/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Both motion preferences at the assigned width
        env:
          BROWSERS: ${{ matrix.browser }}
          WIDTHS: ${{ matrix.width }}
          EVIDENCE_DIR: work/before-after-browser
          REQUIRE_CLEAN: '1'
        run: |
          set -o pipefail
          mkdir -p work
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/before-after-playwright/node_modules/playwright"
          export PNG_MODULE="$RUNNER_TEMP/before-after-playwright/node_modules/pngjs"
          node scripts/verify-before-after-browser.mjs 2>&1 | tee work/before-after-browser.log
      - name: Independent reviewer endpoint-baseline probe
        if: ${{ !cancelled() && matrix.browser == 'webkit' && matrix.width == 375 }}
        env:
          INDEPENDENT_ENGINE: webkit
          INDEPENDENT_WIDTH: 375
          INDEPENDENT_MOTION: no-preference
          INDEPENDENT_EVIDENCE: work/independent-webkit
          REQUIRE_CLEAN: '1'
        run: |
          set -o pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/before-after-playwright/node_modules/playwright"
          export PNG_MODULE="$RUNNER_TEMP/before-after-playwright/node_modules/pngjs"
          node scripts/verify-before-after-independent.mjs 2>&1 | tee work/independent-webkit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: before-after-${{ matrix.browser }}-${{ matrix.width }}-${{ github.event.pull_request.head.sha }}
          path: work/
