name: Diagnose Phase 7D async causality
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        group: [A, B, C]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/phase7d-*diagnostic*.test.mjs tests/phase7d-causal-contract.test.mjs
      - name: Build isolated observation variant
        env:
          DIAGNOSTIC_GROUP: ${{ matrix.group }}
          DIAGNOSTIC_COPY_DIR: work/causal-copy
        run: node scripts/prepare-phase7d-diagnostic.mjs
      - name: Browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/causal-tools" --no-save playwright@1.56.1
          "$RUNNER_TEMP/causal-tools/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Fixed trials without acceptance relaxation
        env:
          DIAGNOSTIC_GROUP: ${{ matrix.group }}
          BROWSERS: ${{ matrix.browser }}
          DIAGNOSTIC_BUILD_DIR: work/causal-copy/out
          DIAGNOSTIC_BUILD_MANIFEST: work/causal-copy/diagnostic-build.json
          DIAGNOSTIC_REPEATS: '3'
          EVIDENCE_DIR: work/phase7d-causal
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/causal-tools/node_modules/playwright"
          mkdir -p "$GITHUB_WORKSPACE/work/browser-tmp"
          export TMPDIR="$GITHUB_WORKSPACE/work/browser-tmp"
          node scripts/diagnose-phase7d-async.mjs
      - name: Audit raw diagnostic evidence independently of product outcome
        if: always()
        env:
          DIAGNOSTIC_GROUP: ${{ matrix.group }}
          BROWSERS: ${{ matrix.browser }}
          DIAGNOSTIC_REPEATS: '3'
        run: |
          export EXPECTED_HEAD="$(git rev-parse HEAD)"
          export EXPECTED_TREE="$(git rev-parse HEAD^{tree})"
          for report in work/phase7d-causal/*/report.json; do
            node scripts/audit-phase7d-causal.mjs "$(dirname "$report")"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase7d-causal-${{ matrix.browser }}-${{ matrix.group }}-${{ github.event.pull_request.head.sha }}
          retention-days: 30
          path: |
            work/phase7d-causal/
            work/causal-copy/diagnostic-build.json
