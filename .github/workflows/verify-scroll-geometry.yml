name: Verify scroll geometry controlled experiments
on:
  pull_request:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: node --test tests/scroll-geometry-post-cancel.test.mjs tests/scroll-geometry-contract.test.mjs tests/standard-touch-contract.test.mjs tests/standard-touch-server.test.mjs tests/iphone-diagnostic-server.test.mjs tests/adjustment-physical-contract.test.mjs tests/adjustment-touch-contract.test.mjs
      - run: node docs/phase6a5/standard-touch/scroll-geometry/independent-review/replay.mjs --current diagnostics/scroll-geometry/contract.mjs
      - name: Independent aggregate fault controls
        run: |
          root=docs/phase6a5/standard-touch/scroll-geometry/aggregate-review
          cp -R "$root" /tmp/iad77-review
          # Preserve committed snapshots; execute the copied harness against current source.
          cp scripts/audit-scroll-geometry.mjs scripts/audit-scroll-files.py /tmp/iad77-review/frozen-final/scripts/
          cp diagnostics/scroll-geometry/contract.mjs /tmp/iad77-review/frozen-final/diagnostics/scroll-geometry/
          cd /tmp/iad77-review
          python3 -B generate-final-mini-fixture.py
          node test-final-mini.mjs
      - run: npm install --prefix /tmp/iad77-tools --no-package-lock playwright@1.56.1 pngjs@7.0.0
      - run: /tmp/iad77-tools/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: node scripts/prepare-standard-touch.mjs
      - run: node scripts/verify-scroll-geometry.mjs
        env:
          PLAYWRIGHT_MODULE: /tmp/iad77-tools/node_modules/playwright
      - name: Independently pin and reaggregate raw trial evidence
        if: always()
        run: |
          node scripts/pin-scroll-binding.mjs > work/scroll-expected-binding.json
          node scripts/audit-scroll-geometry.mjs work/scroll-geometry work/scroll-expected-binding.json
      - name: Independent byte positive and trace negative replay
        if: always()
        run: |
          python3 -B /tmp/iad77-review/test-final-binary.py "$PWD/work/scroll-geometry"
          mkdir -p work/scroll-geometry/independent-replay
          cp /tmp/iad77-review/final-mini-results.json /tmp/iad77-review/final-binary-results.json work/scroll-geometry/independent-replay/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scroll-geometry-${{ github.event.pull_request.head.sha }}
          path: |
            work/scroll-geometry/
            work/scroll-expected-binding.json
          if-no-files-found: error
          retention-days: 90

  legacy-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --prefix /tmp/iad77-tools --no-package-lock playwright@1.56.1 pngjs@7.0.0
      - run: /tmp/iad77-tools/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: node scripts/prepare-standard-touch.mjs
      - name: Original unchanged sixteen-condition regression
        timeout-minutes: 25
        run: |
          set -o pipefail
          node scripts/verify-image-adjustment-browser.mjs 2>&1 | tee work/legacy-browser.log
        env:
          PLAYWRIGHT_MODULE: /tmp/iad77-tools/node_modules/playwright
          PNG_MODULE: /tmp/iad77-tools/node_modules/pngjs
          REQUIRE_CLEAN: '1'
          EVIDENCE_DIR: work/image-adjustment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scroll-geometry-legacy-${{ github.event.pull_request.head.sha }}
          path: |
            work/image-adjustment/
            work/legacy-browser.log
            work/standard-build.json
          if-no-files-found: error
          retention-days: 90
  acceptance:
    if: always()
    needs: [experiment, legacy-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both complete jobs without skipping
        env:
          EXPERIMENT_RESULT: ${{ needs.experiment.result }}
          LEGACY_RESULT: ${{ needs.legacy-regression.result }}
        run: |
          printf 'Primary experiment: %s\nLegacy regression: %s\n' "$EXPERIMENT_RESULT" "$LEGACY_RESULT"
          test "$EXPERIMENT_RESULT" = success
          test "$LEGACY_RESULT" = success
