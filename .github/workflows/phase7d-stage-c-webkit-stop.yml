# Separate, one-shot real WebKit stop observation. Never executes registered Stage C trials.
name: Phase 7D Stage C real WebKit stop-only diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase7d-stage-c-webkit-stop.yml
      - diagnostic-isolated/c-s1-10/real-webkit-stop.test.py
      - diagnostic-isolated/c-s1-10/real-webkit-stop-worker.mjs

permissions:
  contents: read

jobs:
  real-webkit-stop-only:
    name: Observe a single real WebKit launch and supervised stop
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packaged bubblewrap (keep stock AppArmor profile)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends bubblewrap
          fi
          test -x /usr/bin/bwrap
          /usr/bin/bwrap --version
      - name: Install pinned Ubuntu 24.04 WebKit via Playwright 1.56.1
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/stage-c-webkit-stop-tools" --no-save playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/stage-c-webkit-stop-browsers" \
            "$RUNNER_TEMP/stage-c-webkit-stop-tools/node_modules/.bin/playwright" install --with-deps webkit
      - name: Observe WebKit PID namespace and bounded stop (no product trial)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B diagnostic-isolated/c-s1-10/real-webkit-stop.test.py \
            "$RUNNER_TEMP/stage-c-webkit-stop-tools/node_modules/playwright" \
            "$RUNNER_TEMP/stage-c-webkit-stop-browsers"
      - name: Preserve isolated observation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-c-real-webkit-stop-${{ github.run_id }}
          path: ${{ runner.temp }}/stage-c-webkit-stop-evidence
          if-no-files-found: warn
